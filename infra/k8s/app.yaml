apiVersion: v1
kind: ConfigMap
metadata:
  name: seatlock-settings
data:
  DB_URL: jdbc:postgresql://db:5432/seatlock
  DB_USER: seatlock
  DEMO_MODE: "true"
  SPRING_RABBITMQ_HOST: rabbit
  SPRING_RABBITMQ_USERNAME: seatlock
  SPRING_DATA_REDIS_HOST: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seatlock-api
spec:
  replicas: 2
  selector:
    matchLabels: {app: seatlock-api}
  template:
    metadata:
      labels: {app: seatlock-api}
    spec:
      containers:
        - name: api
          image: seatlock-core:local
          imagePullPolicy: Never
          envFrom:
            - configMapRef: {name: seatlock-settings}
            - secretRef: {name: seatlock-secrets}
          env:
            - {name: AUTH_RATE_LIMIT, value: "true"}
            - {name: SERVER_FORWARD_HEADERS_STRATEGY, value: framework}
          ports:
            - {containerPort: 8081, name: http}
          resources:
            requests: {cpu: 150m, memory: 384Mi}
            limits: {cpu: "1", memory: 800Mi}
          startupProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
          livenessProbe:
            tcpSocket: {port: http}
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: {app: seatlock-api}
  ports:
    - {port: 8081, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seatlock-worker
spec:
  replicas: 1
  selector:
    matchLabels: {app: seatlock-worker}
  template:
    metadata:
      labels: {app: seatlock-worker}
    spec:
      containers:
        - name: worker
          image: seatlock-core:local
          imagePullPolicy: Never
          envFrom:
            - configMapRef: {name: seatlock-settings}
            - secretRef: {name: seatlock-secrets}
          env:
            - {name: WORKER_MODE, value: "true"}
            - {name: SPRING_MAIN_WEB_APPLICATION_TYPE, value: none}
            - {name: NOTIFICATION_TRANSPORT, value: rabbit}
          resources:
            requests: {cpu: 150m, memory: 384Mi}
            limits: {cpu: "1", memory: 800Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seatlock-web
spec:
  replicas: 1
  selector:
    matchLabels: {app: seatlock-web}
  template:
    metadata:
      labels: {app: seatlock-web}
    spec:
      containers:
        - name: web
          image: seatlock-web:local
          imagePullPolicy: Never
          ports:
            - {containerPort: 8080, name: http}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /, port: http}
---
apiVersion: v1
kind: Service
metadata:
  name: seatlock-web
spec:
  selector: {app: seatlock-web}
  ports:
    - {port: 8080, targetPort: http}
